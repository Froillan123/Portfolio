name: Deploy Backend (GCP Cloud Run) - Manual

on:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: asia-southeast1
  SERVICE_NAME: portfolio-backend

jobs:
  deploy-cloud-run:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Resolve Environment & Project ID
        id: resolve
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/master" ]]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == "refs/heads/staging" ]]; then
            echo "env=staging" >> "$GITHUB_OUTPUT"
          else
            echo "env=development" >> "$GITHUB_OUTPUT"
          fi

          CLEAN_PROJECT_ID=$(echo -n "${{ secrets.GCP_PROJECT_ID }}" | tr -d '\r\n' | xargs)
          if [ -z "$CLEAN_PROJECT_ID" ]; then
            CLEAN_PROJECT_ID="burnished-ray-485509-g5"
          fi
          echo "PROJECT_ID=${CLEAN_PROJECT_ID}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud via Workload Identity Federation (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Container with Cloud Build
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/portfolio/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          
          echo "🚀 Submitting build to Google Cloud Build: ${IMAGE_URI}"
          gcloud builds submit backend \
            --tag "${IMAGE_URI}" \
            --project "${{ env.PROJECT_ID }}"

      - name: Deploy to Cloud Run
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          echo "🚀 Deploying image to Google Cloud Run..."
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ env.IMAGE_URI }}" \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --platform managed \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 5 \
            --concurrency 80 \
            --timeout 60s \
            --allow-unauthenticated \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }},DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }},ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }},ALLOWED_ORIGINS=https://froillan-edem.vercel.app"

          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format 'value(status.url)')
          
          echo "SERVICE_URL=${SERVICE_URL}" >> "$GITHUB_ENV"
          echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"

      - name: Health Check Verification
        shell: bash
        run: |
          echo "🏥 Probing /api/health endpoint at: ${{ env.SERVICE_URL }}/api/health"
          curl --fail --silent --show-error "${{ env.SERVICE_URL }}/api/health"
          echo ""
          echo "✅ Backend Cloud Run service passed health check!"

      - name: Deployment Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 Froillan Edem Portfolio - Backend Cloud Run"
          echo "Service: ${{ env.SERVICE_NAME }}"
          echo "Region: ${{ env.GCP_REGION }}"
          echo "Live URL: ${{ env.SERVICE_URL }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPLOY_STATUS: ${{ job.status }}
          DEPLOY_TARGET: "Backend (GCP Cloud Run)"
          DEPLOY_ENV: ${{ steps.resolve.outputs.env }}
          DEPLOY_URL: ${{ env.SERVICE_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python .github/scripts_actions/notify_discord.py
