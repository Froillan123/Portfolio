name: Deploy Frontend (Vercel) - Manual

on:
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-vercel:
    name: Deploy to Vercel via CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build & Deploy to Vercel
        id: vercel-deploy
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          CLEAN_TOKEN=$(echo -n "${{ secrets.VERCEL_TOKEN }}" | tr -d '\r\n' | xargs)
          CLEAN_ORG_ID=$(echo -n "${{ secrets.VERCEL_ORG_ID }}" | tr -d '\r\n' | xargs)
          CLEAN_PROJECT_ID=$(echo -n "${{ secrets.VERCEL_PROJECT_ID }}" | tr -d '\r\n' | xargs)

          export VERCEL_ORG_ID="${CLEAN_ORG_ID}"
          export VERCEL_PROJECT_ID="${CLEAN_PROJECT_ID}"

          echo "⬇️ Pulling Vercel project settings..."
          npx vercel pull --yes --environment=production --token="${CLEAN_TOKEN}"
          
          echo "🏗️ Building production artifacts with Vite..."
          npx vercel build --prod --token="${CLEAN_TOKEN}"
          
          echo "🚀 Deploying prebuilt bundle to Vercel..."
          LIVE_URL=$(npx vercel deploy --prebuilt --prod --token="${CLEAN_TOKEN}")
          
          echo "LIVE_URL=${LIVE_URL}" >> "$GITHUB_ENV"
          echo "🎉 Deployment successful: ${LIVE_URL}"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          DEPLOY_STATUS: ${{ job.status }}
          DEPLOY_TARGET: "Frontend (Vercel)"
          DEPLOY_ENV: "production"
          DEPLOY_URL: ${{ env.LIVE_URL || 'https://froillan-edem.vercel.app' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python .github/scripts_actions/notify_discord.py
